name: Publish Compose Bundle

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag to publish
        required: true
        type: string
      source_sha:
        description: Exact source commit expected at the tag
        required: true
        type: string

concurrency:
  group: compose-package-${{ inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/pi0n00r/self-hosted-ai-starter-kit

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v[0-9]*-experimental) ;;
            *)
              echo "Expected an explicit v*-experimental tag, found $RELEASE_TAG" >&2
              exit 1
              ;;
          esac

          actual_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          test "$actual_sha" = "$EXPECTED_SHA"
          test "$tag_sha" = "$EXPECTED_SHA"

          for path in \
            LICENSE \
            README.md \
            .env.example \
            docker-compose.yml \
            localai/models/llama3.2.yaml \
            n8n/demo-data/credentials/xHuYe0MDGOs9IpBW.json \
            n8n/demo-data/workflows/srOnR8PAY3u4RSwb.json
          do
            test -f "$path"
          done

      - name: Build deterministic Compose bundle
        id: bundle
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          artifact="self-hosted-ai-starter-kit-pi0n00r-${RELEASE_TAG}-canonical.tar.gz"
          manifest="self-hosted-ai-starter-kit-pi0n00r-${RELEASE_TAG}-canonical.sha256"

          git archive \
            --format=tar \
            --prefix=self-hosted-ai-starter-kit/ \
            HEAD | gzip -n -9 > "$artifact"

          mkdir extracted
          tar xzf "$artifact" -C extracted
          (
            cd extracted/self-hosted-ai-starter-kit
            find . -type f -print0 |
              sort -z |
              xargs -0 sha256sum
          ) > "$manifest"

          (
            sha256sum "$artifact"
            sha256sum "$manifest"
          ) > SHA256SUMS

          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            oras login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Publish immutable OCI Compose package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACT: ${{ steps.bundle.outputs.artifact }}
          MANIFEST: ${{ steps.bundle.outputs.manifest }}
        run: |
          set -euo pipefail
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          oras push \
            --artifact-type application/vnd.pi0n00r.compose.bundle.v1 \
            --annotation "org.opencontainers.image.created=$created" \
            --annotation "org.opencontainers.image.source=https://github.com/pi0n00r/self-hosted-ai-starter-kit" \
            --annotation "org.opencontainers.image.url=https://github.com/pi0n00r/self-hosted-ai-starter-kit/releases/tag/$RELEASE_TAG" \
            --annotation "org.opencontainers.image.revision=$SOURCE_SHA" \
            --annotation "org.opencontainers.image.version=$RELEASE_TAG" \
            --annotation "org.opencontainers.image.title=Self-hosted AI Starter Kit Compose bundle" \
            --annotation "org.opencontainers.image.description=Experimental LocalAI OpenAI-compatible Intel GPU Compose bundle" \
            --annotation "org.opencontainers.image.licenses=Apache-2.0" \
            "$IMAGE_NAME:$RELEASE_TAG" \
            "$ARTIFACT:application/vnd.pi0n00r.compose.bundle.layer.v1.tar+gzip" \
            "$MANIFEST:text/plain" \
            "SHA256SUMS:text/plain"

          digest="$(oras resolve "$IMAGE_NAME:$RELEASE_TAG")"
          {
            echo "### Published Compose package"
            echo
            echo "\`$IMAGE_NAME:$RELEASE_TAG\`"
            echo
            echo "Digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
