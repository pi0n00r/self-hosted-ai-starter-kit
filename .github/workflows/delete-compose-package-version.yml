name: Delete Superseded Compose Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact superseded package tag
        required: true
        type: string
      expected_digest:
        description: Exact manifest digest required before deletion
        required: true
        type: string

concurrency:
  group: compose-package-delete-${{ inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/pi0n00r/self-hosted-ai-starter-kit

jobs:
  delete:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Validate deletion target
        env:
          PACKAGE_TAG: ${{ inputs.tag }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
        run: |
          set -euo pipefail
          case "$PACKAGE_TAG" in
            v[0-9]*-experimental) ;;
            *)
              echo "Refusing to delete non-experimental tag $PACKAGE_TAG" >&2
              exit 1
              ;;
          esac

          [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            oras login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Delete exact superseded manifest
        env:
          PACKAGE_TAG: ${{ inputs.tag }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
        run: |
          set -euo pipefail
          actual_digest="$(oras resolve "$IMAGE_NAME:$PACKAGE_TAG")"
          test "$actual_digest" = "$EXPECTED_DIGEST"
          oras manifest delete "$IMAGE_NAME@$EXPECTED_DIGEST" --force

          if oras resolve "$IMAGE_NAME:$PACKAGE_TAG" >/dev/null 2>&1; then
            echo "Package tag still resolves after deletion" >&2
            exit 1
          fi
